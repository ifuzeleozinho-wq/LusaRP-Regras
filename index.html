<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061421">
<title>Lusa Roleplay — Livro de Regras</title>
<style>
:root{
  --bg:#06101a;--sidebar:#071520;--panel:#0a1927;--panel2:#0d2031;--panel3:#11293c;
  --line:#173a50;--line2:#1c506b;--text:#f0f7fb;--muted:#9db0bf;--cyan:#13d9e5;--cyan2:#32f4ef;
  --blue:#75aaff;--green:#46e19a;--shadow:0 18px 55px rgba(0,0,0,.28);--radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#06101a;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
body{overflow:hidden;background:radial-gradient(circle at 70% -20%,rgba(20,103,135,.22),transparent 34%),#06101a}
button,input{font:inherit}
.app{height:100vh;display:grid;grid-template-columns:274px 1fr}
.sidebar{height:100vh;display:flex;flex-direction:column;border-right:1px solid #123044;background:
linear-gradient(180deg,rgba(5,20,31,.98),rgba(4,14,23,.99)),radial-gradient(circle at 30% 20%,rgba(19,217,229,.08),transparent 28%);padding:22px 18px 16px;overflow:hidden}
.logo-wrap{height:165px;display:flex;align-items:center;justify-content:center;padding:0 18px 8px}
.logo-wrap img{max-width:178px;max-height:144px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(19,217,229,.16))}
.nav-scroll{overflow:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:#23445a transparent}
.nav-scroll::-webkit-scrollbar{width:5px}.nav-scroll::-webkit-scrollbar-thumb{background:#23445a;border-radius:8px}
.nav-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#708797;margin:10px 13px 8px}
.nav-item{width:100%;border:1px solid transparent;background:transparent;color:#c4d0db;display:flex;align-items:center;gap:15px;padding:13px 13px;border-radius:8px;cursor:pointer;text-align:left;margin:2px 0;transition:.16s ease}
.nav-item:hover{color:#fff;background:rgba(19,217,229,.05)}
.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(14,67,82,.95),rgba(9,45,58,.82));border-color:#0ea9bf;box-shadow:inset 3px 0 0 var(--cyan),0 0 22px rgba(19,217,229,.08)}
.nav-ico{width:22px;height:22px;flex:0 0 22px;color:#bdd3e3}.nav-item.active .nav-ico{color:#e8fbff}
.sidebar-bottom{margin-top:auto;border-top:1px solid #183646;padding:16px 10px 2px}
.side-action{display:flex;align-items:center;gap:12px;color:#b9c9d6;padding:9px 0;font-size:14px}.side-action svg{width:20px;height:20px}
.server-status{border-top:1px solid #183646;margin-top:10px;padding-top:15px;color:#c9d9e4;font-size:13px}.online{display:block;color:#51e49c;margin-top:3px;padding-left:24px}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#51e49c;box-shadow:0 0 12px rgba(81,228,156,.6);margin-right:10px}
.content-shell{height:100vh;overflow:auto;scrollbar-width:thin;scrollbar-color:#536470 transparent;padding:20px 26px 26px}
.content-shell::-webkit-scrollbar{width:7px}.content-shell::-webkit-scrollbar-thumb{background:#536470;border-radius:9px}
.topbar{height:58px;display:flex;align-items:center;gap:16px;margin-bottom:18px}
.search-box{position:relative;display:flex;align-items:center;gap:12px;flex:1;max-width:530px;background:#0b1a29;border:1px solid #17354a;border-radius:9px;padding:0 15px;height:44px}
.search-box svg{width:18px;height:18px;color:#b9d0e0}.search-box input{border:0;outline:0;background:transparent;color:#e9f5fb;width:100%;font-size:14px}.search-box input::placeholder{color:#91a8b9}
.kbd{border:1px solid #243e52;border-radius:6px;padding:4px 8px;color:#879bac;font-size:11px;background:#0a1825;white-space:nowrap}
.top-spacer{flex:1}
.top-icon{width:42px;height:42px;border:0;background:transparent;color:#d4e4ee;display:grid;place-items:center;cursor:default}.top-icon svg{width:21px;height:21px}
.profile{display:flex;align-items:center;gap:10px;border-left:1px solid #112c3e;padding-left:18px;color:#eef7fb}.avatar{width:39px;height:39px;border:1px solid #7ba5c3;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1e4260,#0e2334)}.avatar svg{width:21px;height:21px;color:#b9d5e9}

.panel{background:linear-gradient(180deg,rgba(8,22,35,.98),rgba(7,18,29,.98));border:1px solid #17364a;border-top:0;border-radius:0 0 11px 11px;padding:0 22px 22px;min-height:600px}
.breadcrumb{height:54px;display:flex;align-items:center;gap:11px;color:#899dad;font-size:13px;padding:0 2px}.breadcrumb svg{width:17px;height:17px}.chev{color:#4f6676}
.section-head{position:relative;display:flex;align-items:center;min-height:102px;border:1px solid #193c52;border-radius:10px;background:linear-gradient(100deg,rgba(11,52,65,.5),rgba(11,28,43,.65));padding:18px 22px;margin-bottom:14px;overflow:hidden}
.section-icon{width:48px;height:48px;border-radius:9px;border:1px solid #0d7185;background:linear-gradient(145deg,#0b4250,#0a2837);display:grid;place-items:center;color:#dcf8ff;margin-right:20px;box-shadow:inset 0 0 18px rgba(19,217,229,.08)}.section-icon svg{width:28px;height:28px}
.section-title{margin:0;font-size:29px;line-height:1.1;letter-spacing:-.02em}.section-desc{margin:7px 0 0;color:#9fb2c1;font-size:14px}
.ghost-num{position:absolute;right:30px;top:3px;font-size:72px;font-weight:800;color:rgba(120,166,192,.07);letter-spacing:-.06em;user-select:none}.accent-line{position:absolute;right:31px;bottom:15px;width:34px;height:3px;border-radius:4px;background:var(--cyan)}
.rule-list{display:grid;gap:8px}
.group-title{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7fcfe0;margin:15px 2px 4px;font-weight:700}
.rule-card{border:1px solid #28506a;border-radius:9px;background:linear-gradient(180deg,#0d1d2d,#0a1825);overflow:hidden;transition:.15s ease}
.rule-card:hover{border-color:#33708e}.rule-card.open{border-color:#0aa7bd;box-shadow:0 0 0 1px rgba(19,217,229,.06)}
.rule-row{min-height:54px;display:grid;grid-template-columns:78px 1fr 32px;gap:10px;align-items:center;padding:0 15px;cursor:pointer}
.rule-code{color:var(--cyan);font-weight:800;font-size:16px}.rule-code.generic{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7ccbdd}
.rule-summary{font-size:14px;font-weight:600;color:#f3f8fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule-caret{display:grid;place-items:center;color:#a9c0d0;transition:.18s}.rule-caret svg{width:18px;height:18px}.rule-card.open .rule-caret{transform:rotate(180deg);color:var(--cyan)}
.rule-detail{display:none;margin:0 15px 13px 91px;background:linear-gradient(90deg,rgba(24,48,67,.95),rgba(18,41,59,.72));border-top:1px solid #1a3c50;padding:14px 16px 14px;color:#bdd0dc;font-size:14px;line-height:1.6}.rule-card.open .rule-detail{display:block}
.text-card,.note-card,.list-card{border:1px solid #204458;border-radius:9px;background:#0b1c2a;color:#c6d6e1;padding:15px 18px;line-height:1.6;font-size:14px}
.note-card{border-color:#0c7182;background:rgba(11,51,64,.55)}.list-card ul{margin:0;padding-left:20px}.list-card li{margin:5px 0}
.support{margin-top:14px;min-height:78px;border:1px solid #183c52;border-radius:9px;background:linear-gradient(180deg,#0b1d2b,#091723);display:flex;align-items:center;gap:16px;padding:14px 18px}
.info-orb{width:39px;height:39px;border-radius:50%;border:3px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font-weight:900;font-size:20px;box-shadow:0 0 17px rgba(19,217,229,.24)}.support-copy strong{display:block;font-size:14px}.support-copy span{display:block;color:#91a6b6;font-size:13px;margin-top:2px}.support-btn{margin-left:auto;border:1px solid #294a79;background:#0f2442;color:#9bbcff;border-radius:7px;padding:11px 16px;font-weight:700}
.search-results{position:absolute;left:0;right:0;top:50px;z-index:20;background:#071725;border:1px solid #1d4962;border-radius:9px;box-shadow:0 22px 45px rgba(0,0,0,.4);max-height:370px;overflow:auto;display:none;padding:6px}.search-results.show{display:block}
.result{padding:10px 11px;border-radius:7px;cursor:pointer;border:1px solid transparent}.result:hover{background:#0d2637;border-color:#1a4d64}.result-top{display:flex;gap:9px;align-items:center;color:#e8f5fa;font-size:13px}.result-code{color:var(--cyan);font-weight:800}.result-sec{color:#7f96a7;font-size:11px;margin-top:4px}.no-result{padding:14px;color:#8fa5b5;font-size:13px}
.mobile-menu{display:none}
@media(max-width:1050px){.app{grid-template-columns:235px 1fr}.content-shell{padding:14px}.profile{display:none}.banner{height:220px}}
@media(max-width:760px){body{overflow:auto}.app{display:block;height:auto}.sidebar{position:fixed;z-index:40;left:-290px;top:0;width:274px;transition:.2s}.sidebar.show{left:0}.content-shell{height:auto;min-height:100vh;overflow:visible;padding:10px}.mobile-menu{display:grid;place-items:center;width:42px;height:42px;border:1px solid #17354a;border-radius:8px;background:#0b1a29;color:#d9edf7}.topbar{position:sticky;top:0;z-index:25;background:#06101a;padding:4px 0}.search-box{max-width:none}.banner{height:150px}.panel{padding:0 10px 14px}.section-head{padding:14px;min-height:88px}.section-title{font-size:22px}.ghost-num{font-size:48px;right:15px}.section-icon{width:42px;height:42px;margin-right:12px}.rule-row{grid-template-columns:62px 1fr 24px;padding:0 10px}.rule-code{font-size:14px}.rule-summary{font-size:13px}.rule-detail{margin:0 10px 10px;padding:12px 13px}.support{align-items:flex-start}.support-btn{display:none}}
</style>
</head>

<script>
const sections={"geral": {"id": "geral", "title": "Livro de Regras", "desc": "A Lusa Roleplay é uma comunidade que valoriza a diversidade, a inclusão, o respeito e a segurança de todos os jogadores.", "items": [{"type": "note", "text": "Não toleramos transfobia, homofobia, racismo, capacitismo ou qualquer outra forma de discriminação. O incumprimento poderá resultar em banimento permanente e irreversível."}]}, "termos": {"id": "termos", "title": "Termos e Condições", "desc": "Ao entrar na cidade, o jogador declara que tomou conhecimento e aceita cumprir as regras e documentos oficiais da Lusa Roleplay.", "items": [{"type": "group", "text": "1 — Acesso ao Jogo"}, {"type": "rule", "code": "1.1", "text": "A cidade é um ambiente virtual de jogo alojado através de uma empresa terceira contratada pelas entidades responsáveis."}, {"type": "rule", "code": "1.2", "text": "O acesso é realizado através do Multi Theft Auto. Ao entrar na cidade, o jogador aceita os termos e regras."}, {"type": "group", "text": "2 — Utilização do Servidor"}, {"type": "rule", "code": "2.1", "text": "É obrigatório cumprir todas as regras gerais e específicas de Roleplay."}, {"type": "rule", "code": "2.2", "text": "Conhecer as regras não isenta o jogador de agir com bom senso."}, {"type": "rule", "code": "2.3", "text": "Cada jogador é responsável por se manter atualizado."}, {"type": "rule", "code": "2.4", "text": "A utilização de ferramentas de monitorização para segurança e integridade é aceite ao entrar no servidor."}, {"type": "rule", "code": "2.5", "text": "Em caso de dúvida, procure esclarecimento junto da Staff antes de realizar a ação."}, {"type": "group", "text": "3 — Advertências e Banimentos"}, {"type": "rule", "code": "3.1", "text": "A Administração possui autonomia para aplicar as punições adequadas."}, {"type": "rule", "code": "3.2", "text": "As punições podem incluir advertências, sanções temporárias e banimentos."}, {"type": "rule", "code": "3.3", "text": "A reincidência poderá agravar a punição, podendo resultar em banimento permanente."}, {"type": "group", "text": "4 — Loja Lusa"}, {"type": "rule", "code": "4.1", "text": "As compras contribuem para a manutenção e melhoria do servidor."}, {"type": "rule", "code": "4.2", "text": "Os compradores estão sujeitos às mesmas regras que os restantes jogadores."}, {"type": "group", "text": "5 — Itens do Jogo"}, {"type": "rule", "code": "5.1", "text": "Os itens pertencem exclusivamente ao ambiente da Lusa Roleplay."}, {"type": "rule", "code": "5.2", "text": "É proibida a compra ou venda de itens por dinheiro real ou plataformas externas."}, {"type": "group", "text": "6 — Wipe"}, {"type": "rule", "code": "6.1", "text": "O wipe reinicia itens e ativos para equilibrar a economia e renovar a experiência."}, {"type": "rule", "code": "6.2", "text": "O wipe não elimina punições nem o histórico comportamental."}]}, "rp": {"id": "rp", "title": "Regras de Roleplay", "desc": "As regras garantem uma experiência imersiva, coerente, justa e divertida, evitando Anti-Roleplay.", "items": [{"type": "group", "text": "Roleplay"}, {"type": "text", "text": "Interpretação de uma personagem, respeitando a sua personalidade, história, motivações e contexto."}, {"type": "group", "text": "Anti-Roleplay"}, {"type": "text", "text": "Comportamentos que desrespeitem ou interfiram com o Roleplay, incluindo agir fora da personagem ou quebrar a imersão."}, {"type": "group", "text": "9 — Amor à Vida"}, {"type": "rule", "code": "9.1", "text": "Valorize a vida da personagem e evite perigos desnecessários."}, {"type": "rule", "code": "9.2", "text": "É proibido enfrentar situações perigosas de forma irrealista."}, {"type": "rule", "code": "9.3", "text": "Perante risco iminente, priorize a sobrevivência."}, {"type": "rule", "code": "9.4", "text": "Respeite ferimentos e demonstre as suas consequências."}, {"type": "group", "text": "10 — RDM"}, {"type": "rule", "code": "10.1", "text": "Atacar, ferir ou matar sem motivo válido de RP constitui RDM."}, {"type": "rule", "code": "10.2", "text": "Não inicie combates sem contexto narrativo válido."}, {"type": "group", "text": "11 — VDM"}, {"type": "rule", "code": "11.1", "text": "Utilizar veículos para atropelar, ferir ou matar sem justificação válida constitui VDM."}, {"type": "group", "text": "12 — Combat Logging"}, {"type": "rule", "code": "12.1", "text": "É proibido desligar-se intencionalmente durante uma ação para evitar consequências."}, {"type": "rule", "code": "12.2", "text": "Sair do servidor após ficar incapacitado para escapar ao RP é considerado Combat Logging."}, {"type": "group", "text": "13 — PowerGaming"}, {"type": "rule", "code": "13.1", "text": "É proibida a utilização irrealista das mecânicas do jogo para obter vantagens."}, {"type": "group", "text": "14 — Metagaming"}, {"type": "rule", "code": "14.1", "text": "É proibido utilizar informação obtida fora do RP para influenciar a personagem."}, {"type": "group", "text": "15 — Revenge Kill"}, {"type": "rule", "code": "15.1", "text": "É proibida a vingança após a morte da personagem utilizando informações que ela não poderia possuir."}, {"type": "group", "text": "16 — Cop Bait"}, {"type": "rule", "code": "16.1", "text": "É proibido provocar ou enganar a polícia de forma abusiva apenas para gerar uma situação de confronto."}, {"type": "group", "text": "17 — Flaming"}, {"type": "rule", "code": "17.1", "text": "São proibidos insultos, provocações, ameaças, discriminação e assédio."}, {"type": "group", "text": "18 — Dark RP"}, {"type": "rule", "code": "18.1", "text": "Temas extremos ou perturbadores que ultrapassem os limites aceitáveis de RP são proibidos."}, {"type": "group", "text": "19 — Personagem"}, {"type": "rule", "code": "19.1", "text": "Os nomes devem ser realistas e adequados ao Roleplay."}, {"type": "group", "text": "20 — Forçar RP"}, {"type": "rule", "code": "20.1", "text": "É proibido forçar situações sem narrativa coerente para provocar confrontos ou mortes."}, {"type": "group", "text": "21 — Furto e Roubo"}, {"type": "rule", "code": "21.1", "text": "Furto consiste na obtenção de bens sem abordagem direta. Roubo envolve abordagem, intimidação ou violência."}]}, "gerais": {"id": "gerais", "title": "Regras Gerais", "desc": "Regras gerais de conduta e utilização das mecânicas do servidor.", "items": [{"type": "rule", "code": "22.1", "text": "O bom senso é primordial."}, {"type": "rule", "code": "22.2", "text": "É proibido utilizar “OFF RP” dentro da cidade."}, {"type": "rule", "code": "22.5", "text": "Em caso de crash durante uma ação, o jogador fica automaticamente fora da ação até ao seu término."}, {"type": "rule", "code": "22.7", "text": "É proibido furtar ou roubar veículos de serviços legais."}, {"type": "rule", "code": "22.12", "text": "A utilização de /cam para criação de conteúdo, benefício próprio ou ações indevidas é proibida."}, {"type": "rule", "code": "22.18", "text": "É proibido utilizar garagens para escapar a abordagens, perseguições ou ações policiais."}, {"type": "rule", "code": "22.19", "text": "Após entrar no servidor, respeite os 5 minutos de GOD MOD."}, {"type": "rule", "code": "22.22", "text": "É proibida a exploração de bugs para obter vantagens."}, {"type": "rule", "code": "22.23", "text": "O servidor é restrito a maiores de 18 anos."}]}, "punicoes": {"id": "punicoes", "title": "Regras de Punições", "desc": "Referência das punições administrativas previstas para infrações.", "items": [{"type": "rule", "code": "Combat Log", "text": "3h + 10% do dinheiro + remoção do inventário + restantes medidas aplicáveis."}, {"type": "rule", "code": "Metagaming", "text": "2h + 10% do dinheiro."}, {"type": "rule", "code": "Flaming", "text": "2h + 10% do dinheiro."}, {"type": "rule", "code": "Anti Amor à Vida", "text": "3h + 10%, podendo existir PD."}, {"type": "rule", "code": "RDM", "text": "3h + 10% do saldo total + medidas adicionais aplicáveis."}, {"type": "rule", "code": "VDM", "text": "2h30 + 10% + medidas adicionais aplicáveis."}, {"type": "rule", "code": "Quebra de Regras", "text": "1h30 + 10%."}, {"type": "rule", "code": "Car Jack", "text": "1h + 10%."}, {"type": "rule", "code": "Forçar RP", "text": "1h30 + 10%."}, {"type": "rule", "code": "Revenge Kill", "text": "2h + 10%."}, {"type": "rule", "code": "Abuso de Bug", "text": "3h + 10%, podendo existir PD ou medidas adicionais."}, {"type": "rule", "code": "Anti-Roleplay", "text": "2h30 + 10%."}, {"type": "rule", "code": "PowerGaming", "text": "3h + 10%, podendo existir PD."}, {"type": "rule", "code": "Dark RP", "text": "3h + PD, conforme avaliação administrativa."}]}, "policia": {"id": "policia", "title": "Regras Policiais", "desc": "Normas de atuação, abordagem e procedimento para forças policiais.", "items": [{"type": "rule", "code": "23.1", "text": "Não é permitido representar simultaneamente uma personagem policial e uma personagem ilegal, salvo o corpo policial de investigação."}, {"type": "rule", "code": "23.4", "text": "A polícia não pode parar ou revistar sem motivo válido."}, {"type": "rule", "code": "23.8", "text": "Entradas em favelas dependem dos requisitos de contingente, autorização e provas definidos pela regra."}, {"type": "rule", "code": "24.1", "text": "Caixa 2 policial é proibido sem autorização da Staff."}, {"type": "rule", "code": "25.1", "text": "Nas perseguições com fuga limpa, devem ser respeitados os 5 minutos previstos nas regras 43–45 antes de serem efetuados disparos contra os pneus, salvo se os fugitivos iniciarem confronto armado antes desse período."}]}, "safe": {"id": "safe", "title": "Safezones", "desc": "Nas zonas seguras é proibido realizar roubos, acampamentos, tiroteios ou sequestros.", "items": [{"type": "list", "items": ["Praças", "Hospitais", "Mecânicos", "Garagens públicas", "Restaurantes e lojas", "Delegacias", "Prisões", "Bases de empregos legais"]}, {"type": "rule", "code": "28.1", "text": "Não espere que alguém abandone uma Safezone para iniciar uma abordagem, roubo ou ação."}, {"type": "rule", "code": "28.4", "text": "Não são permitidos sons ambiente em Safezones."}]}, "denuncias": {"id": "denuncias", "title": "Regras de Denúncias", "desc": "Requisitos para denúncias, provas e análise administrativa.", "items": [{"type": "rule", "code": "29.1", "text": "A denúncia deve explicar claramente o ocorrido, envolvidos, infração, data, hora e local."}, {"type": "rule", "code": "29.2", "text": "O vídeo deve ter, preferencialmente, pelo menos 1 minuto e incluir áudio e comunicação relevante do jogo."}, {"type": "rule", "code": "29.7", "text": "O prazo para apresentar uma denúncia é de 48 horas."}, {"type": "rule", "code": "29.8", "text": "Os vídeos devem ser enviados através de plataformas externas de streaming; não são aceites links de armazenamento em nuvem."}, {"type": "rule", "code": "29.10", "text": "Guarde o clip durante pelo menos 7 dias após a ação."}, {"type": "rule", "code": "29.12", "text": "É proibido gravar, divulgar ou partilhar chamadas de alinhamento da Staff."}]}, "acoes": {"id": "acoes", "title": "Regras de Ações", "desc": "Normas gerais aplicáveis às ações e confrontos dentro da cidade.", "items": [{"type": "rule", "code": "30.1", "text": "Não utilize comandos antes, durante ou depois de ações para obter vantagens indevidas."}, {"type": "rule", "code": "30.3", "text": "O porta-bagagens não pode ser utilizado para iniciar ou realizar drops em ações de rua/marcadas, salvo as exceções previstas."}, {"type": "rule", "code": "30.5", "text": "Durante uma fuga limpa não são permitidos tiroteios ou utilização de armas para iniciar confronto."}, {"type": "rule", "code": "30.8", "text": "Não é permitido matar sem dar voz."}, {"type": "rule", "code": "30.10", "text": "O resgate máximo normal é de 50 000 € por refém e até 4 reféns por ação, salvo as exceções previstas para ações não marcadas."}, {"type": "rule", "code": "30.12", "text": "As guerras devem respeitar os limites mínimos e máximos de participantes definidos."}, {"type": "group", "text": "31 — Cobranças"}, {"type": "rule", "code": "31.1", "text": "Cobranças devem possuir contexto e respeitar os prazos definidos."}, {"type": "group", "text": "32 — Invasões"}, {"type": "rule", "code": "32.1", "text": "Invasões de favelas e casas de crime exigem RP, história e contexto prévios."}]}, "ilegal": {"id": "ilegal", "title": "Ilegal", "desc": "Diretrizes para facções, conflitos, guerras e organizações ilegais.", "items": [{"type": "group", "text": "34 — Cúpula x Ilegal"}, {"type": "rule", "code": "34.01", "text": "As decisões da Cúpula das facções devem ser respeitadas por todos os membros."}, {"type": "rule", "code": "34.02", "text": "Após a marcação de uma guerra ou invasão, a facção atingida é obrigada a participar, podendo existir sanções ou multa em caso de incumprimento."}, {"type": "group", "text": "35 — Guerras e Conflitos de Facções"}, {"type": "rule", "code": "35.01", "text": "As guerras devem ter motivo grave, narrativa sólida, comunicação à Cúpula e antecedência mínima de 48 horas."}, {"type": "rule", "code": "35.02", "text": "Nenhuma guerra pode começar sem autorização da Cúpula. A duração máxima é de 5 dias, com intervalo mínimo de 12 horas entre grandes confrontos."}, {"type": "rule", "code": "35.03", "text": "Cada facção pode mobilizar até 20 membros por confronto. Aliados precisam de autorização prévia."}, {"type": "group", "text": "36 — Invasões e Resgates"}, {"type": "rule", "code": "36.01", "text": "A vida de cada membro deve ser devidamente valorizada. A falta de valorização poderá resultar em PD."}]}, "assaltos": {"id": "assaltos", "title": "37–41 — Assaltos de Rua e Sequestro", "desc": "Regras para assaltos de rua, abordagem e situações com reféns.", "items": [{"type": "rule", "code": "37.01", "text": "O assalto deve possuir motivo coerente e fazer sentido dentro do Roleplay."}, {"type": "rule", "code": "37.03", "text": "O saqueamento de uma pessoa desmaiada só pode ser realizado por jogadores diretamente envolvidos na ação."}, {"type": "rule", "code": "37.04", "text": "É proibido realizar assaltos sozinho; são necessários pelo menos 2 jogadores."}, {"type": "rule", "code": "38.01", "text": "É proibido assaltar em Safezones ou em locais de grande movimentação policial."}, {"type": "rule", "code": "39.01", "text": "Utilize uma abordagem coerente, sem termos OOC."}, {"type": "rule", "code": "39.06", "text": "Um refém pode ser mantido durante, no máximo, 1 hora."}, {"type": "rule", "code": "40.01", "text": "O uso de armas deve ser proporcional à situação."}, {"type": "rule", "code": "41.03", "text": "Trate a vítima dentro do RP e evite humilhação excessiva ou tortura sem contexto."}]}, "fuga": {"id": "fuga", "title": "43–45 — Fuga da Polícia", "desc": "Regras sobre perseguições, disparos, veículos e condutas durante fugas.", "items": [{"type": "rule", "code": "43.01", "text": "A fuga limpa terá duração de 5 minutos, contados a partir do início efetivo da perseguição. Durante este período, nenhuma das partes poderá realizar disparos contra o veículo ou iniciar confronto armado."}, {"type": "rule", "code": "43.02", "text": "Após os 5 minutos de fuga limpa, a polícia poderá efetuar disparos exclusivamente contra os pneus do veículo em fuga, com o objetivo de o imobilizar."}, {"type": "rule", "code": "43.03", "text": "É proibida a realização de manobras PIT por ambas as partes durante toda a perseguição. Também são proibidas colisões intencionais utilizadas para rodar, empurrar ou retirar o veículo adversário da via."}, {"type": "rule", "code": "44.01", "text": "Caso o veículo em fuga capote, não poderá retomar a fuga com o mesmo veículo. Os ocupantes deverão abandoná-lo e optar por rendição, fuga a pé ou confronto armado, assumindo as consequências da escolha."}, {"type": "rule", "code": "44.02", "text": "Caso o veículo fique com os quatro pneus furados, é obrigatório abandonar o veículo. Os ocupantes poderão render-se, fugir a pé ou iniciar confronto armado."}, {"type": "rule", "code": "44.03", "text": "Durante os 5 minutos de fuga limpa, é proibido dropar ou iniciar disparos contra a polícia. O incumprimento desta regra poderá resultar em prisão administrativa, conforme avaliação da Staff."}, {"type": "rule", "code": "45.01", "text": "Durante corridas ilegais não é permitido apoio de terceiros durante a perseguição."}]}, "pacificacao": {"id": "pacificacao", "title": "46 — Pacificação / Incursão", "desc": "Normas para incursões, pacificações e controlo territorial.", "items": [{"type": "rule", "code": "46.01", "text": "Após uma invasão policial, o território fica em pacificação durante 1 dia e a facção não pode utilizá-lo."}, {"type": "rule", "code": "46.02", "text": "No final da pacificação, a Administração avaliará o regresso da facção ao território."}, {"type": "rule", "code": "46.03", "text": "Caso a polícia conquiste o território, os itens ilegais armazenados no baú são confiscados e perdidos permanentemente."}, {"type": "rule", "code": "46.04", "text": "A autorização de uma pacificação exige provas e anexos que justifiquem a operação."}, {"type": "note", "text": "Uma ação de rua que termine dentro de uma favela não constitui, por si só, uma pacificação. São necessárias provas de investigação."}]}, "drogas": {"id": "drogas", "title": "Compra e Venda de Drogas", "desc": "Regras aplicáveis à compra, venda e abordagem durante tráfico de drogas.", "items": [{"type": "rule", "code": "", "text": "A venda pode ocorrer com NPCs na rua, em locais específicos e com outras pessoas, não sendo exclusiva de qualquer grupo."}, {"type": "rule", "code": "", "text": "Não existe limite mínimo ou máximo de participantes."}, {"type": "rule", "code": "", "text": "É extremamente proibida a utilização de armas de fogo por bandidos e polícias durante a venda."}, {"type": "rule", "code": "", "text": "A polícia pode utilizar Taser conforme a situação, respeitando a quantidade equivalente de bandidos presentes ou em caso de fuga."}, {"type": "rule", "code": "", "text": "É extremamente proibida a utilização de helicópteros durante a venda de drogas."}]}, "emboscada": {"id": "emboscada", "title": "47 — Emboscada", "desc": "Condições para emboscadas, reforços e início de confrontos.", "items": [{"type": "rule", "code": "47.01", "text": "O QRR de ambos os lados só é permitido se os reforços chegarem durante a perseguição, antes do início dos disparos. Os criminosos podem posicionar o QRR no local escolhido para a troca de tiros."}, {"type": "rule", "code": "47.02", "text": "É obrigatório aguardar que os oponentes saiam do veículo antes de iniciar os disparos. Após o início, todos devem permanecer fora dos veículos."}, {"type": "rule", "code": "47.03", "text": "A ação inicia quando o veículo perseguidor realiza o drop ou, numa emboscada, quando entra no local onde os membros estão posicionados."}, {"type": "rule", "code": "47.04", "text": "Não é permitido Taser nesta finalidade; apenas armas de fogo."}]}, "sequestro": {"id": "sequestro", "title": "49 — Sequestro", "desc": "O sequestro exige um motivo plausível dentro do Roleplay, como cobranças, conflitos entre facções, interesses coerentes com a história, traições ou interferências repetidas em ações criminosas.", "items": [{"type": "group", "text": "Motivo Plausível"}, {"type": "rule", "code": "", "text": "Não são válidos motivos como antipatia, discussões no Discord, denúncias ou outras ações fora do RP."}, {"type": "rule", "code": "", "text": "Sequestros previamente combinados entre as partes são estritamente proibidos."}, {"type": "group", "text": "49.01 — Abordagem e Execução"}, {"type": "rule", "code": "", "text": "É proibido sequestrar jogadores em Safezones."}, {"type": "rule", "code": "", "text": "São proibidas humilhações, nudez forçada, atos ou insinuações sexuais e tortura excessiva sem desenvolvimento narrativo."}, {"type": "group", "text": "49.02 — Tempo e Finalização"}, {"type": "rule", "code": "", "text": "O sequestro deve possuir um objetivo claro e não pode ser prolongado apenas para prejudicar outro jogador."}, {"type": "group", "text": "49.03 — Quantidade de Pessoas"}, {"type": "rule", "code": "", "text": "O grupo que inicia o sequestro deve possuir superioridade numérica e todos os envolvidos devem estar devidamente armados."}, {"type": "group", "text": "49.04 — Oficiais em Serviço"}, {"type": "rule", "code": "", "text": "Não é permitido sequestrar médicos ou mecânicos fardados. Policiais fardados só podem ser sequestrados quando existir estrutura e contexto adequado de RP."}]}, "caixa2": {"id": "caixa2", "title": "50 — Caixa 2", "desc": "Regras sobre desvios de recursos e corrupção dentro das organizações.", "items": [{"type": "rule", "code": "", "text": "Desvios de itens, valores ou recursos por membros abaixo do cargo de Gerente são considerados Caixa 2."}, {"type": "rule", "code": "", "text": "Membros com cargo de Gerente ou superior não se enquadram nesta regra; conflitos deste tipo devem ser resolvidos internamente através de RP e cobranças."}, {"type": "rule", "code": "", "text": "Não é permitida corrupção policial, incluindo utilização indevida de dinheiro ou itens apreendidos. Infrações comprovadas poderão resultar em banimento permanente."}]}, "software": {"id": "software", "title": "51–52 — Software", "desc": "Normas relacionadas com cheats, verificações e integridade do jogo.", "items": [{"type": "rule", "code": "51.01", "text": "Em caso de suspeita de cheats, o jogador poderá ser monitorizado pela Staff."}, {"type": "rule", "code": "51.02", "text": "Após ser informado de que será monitorizado, deverá comparecer ao suporte no prazo máximo de 60 segundos."}, {"type": "rule", "code": "52.03", "text": "É proibido fechar o jogo quando um membro da Staff solicitar entrada numa chamada de suporte."}, {"type": "rule", "code": "52.04", "text": "É proibido desligar o computador durante a verificação."}, {"type": "rule", "code": "52.05", "text": "Vestígios de cheats/bypass ou conversas com vendedores de hacks podem resultar em banimento permanente."}, {"type": "rule", "code": "52.06", "text": "A utilização de bypass para ocultar ou apagar provas, desativar configurações ou interromper processos/registos também poderá resultar em banimento permanente."}, {"type": "rule", "code": "52.07", "text": "É proibida qualquer apologia a hacks, bypass ou trapaças."}, {"type": "rule", "code": "52.08", "text": "Após abordagem ou banimento, é proibida qualquer manipulação dos ficheiros, aplicações, processos ou registos do computador relacionados com a verificação."}, {"type": "rule", "code": "52.09", "text": "É proibido remover dispositivos USB, formatar o computador, criar pontos de restauro, trocar o utilizador do Windows ou iniciar aplicações de limpeza/desinstalação durante a verificação."}, {"type": "rule", "code": "52.10", "text": "Três ou mais denúncias com vídeos que apresentem suspeitas de aimbot, wallhack ou semelhantes poderão ser analisadas por especialistas."}, {"type": "rule", "code": "52.11", "text": "Ficheiros identificados como bypass ou com remoções/alterações de datas poderão ser considerados cheat."}, {"type": "rule", "code": "52.12", "text": "A recusa em realizar a verificação poderá resultar em banimento."}, {"type": "rule", "code": "52.13", "text": "É proibida a permanência em Discords dedicados a cheats/bypass."}, {"type": "rule", "code": "52.14", "text": "É proibido compactuar com cheaters/bypass."}]}, "acoes-especificas": {"id": "acoes-especificas", "title": "Ações — Regras específicas", "desc": "Regras e parâmetros específicos para ações marcadas.", "items": [{"type": "group", "text": "Barbearia"}, {"type": "rule", "code": "", "text": "Bandidos: mínimo 2, máximo 4. Polícia: mínimo 2, máximo 4."}, {"type": "rule", "code": "", "text": "Não é permitido armamento; a ação é realizada exclusivamente com combate corpo a corpo."}, {"type": "rule", "code": "", "text": "Negociação obrigatória. Permanência de 15 minutos após a conclusão. Não é permitida fuga."}, {"type": "rule", "code": "", "text": "Permitidos utilitários: energético, kit médico e colete."}, {"type": "rule", "code": "", "text": "Perímetro: apenas o interior da barbearia."}, {"type": "group", "text": "Lojinhas"}, {"type": "rule", "code": "", "text": "Bandidos: 2–4. Polícia: 3–5. Apenas pistolas. Máximo de 1 refém."}, {"type": "rule", "code": "", "text": "Negociação obrigatória. Pode ser negociada fuga com apenas 1 carro dos bandidos."}, {"type": "rule", "code": "", "text": "Após 8 minutos de FF, é permitido rush para o perímetro frontal e lateral da loja."}, {"type": "group", "text": "Caixa Registadora"}, {"type": "rule", "code": "", "text": "Bandidos: mínimo 1. Polícia: 1–3 unidades."}, {"type": "rule", "code": "", "text": "Fuga limpa durante os primeiros 5 minutos. Após esse período, aplicam-se integralmente as regras 43–45 de Fuga da Polícia."}, {"type": "rule", "code": "", "text": "BAIT apenas em áreas definidas como emboscada. Todas as armas são permitidas durante a emboscada."}, {"type": "group", "text": "Joalheria"}, {"type": "rule", "code": "", "text": "Bandidos: 6–8. Polícia: 8–10. Permitido apenas Sub. Máximo de 4 reféns."}, {"type": "rule", "code": "", "text": "Tempo de espera: 35 minutos. Fuga negociável. Máximo de 3 carros por lado dos bandidos."}, {"type": "group", "text": "Fazenda"}, {"type": "rule", "code": "", "text": "Bandidos: 5–7. Polícia: 7–9. Permitido apenas Sub. Máximo de 4 reféns."}, {"type": "rule", "code": "", "text": "Tempo de espera: 35 minutos. Fuga proibida. Perímetro conforme imagem oficial da ação."}, {"type": "group", "text": "Banco Central LV"}, {"type": "rule", "code": "", "text": "Bandidos: 8–12. Polícia: 11–15. Permitido apenas fuzil. Máximo de 4 reféns."}, {"type": "rule", "code": "", "text": "Tempo de espera: 50 minutos. Só é permitido sair do banco após 10 minutos de FF. Até 2 elementos podem ficar fora durante a negociação, respeitando o perímetro."}, {"type": "rule", "code": "", "text": "É proibido utilizar bugs visuais ou permanecer avançado na zona do caixa à espera da entrada da polícia."}]}};
const searchIndex=[{"section": "termos", "idx": 1, "code": "1.1", "text": "A cidade é um ambiente virtual de jogo alojado através de uma empresa terceira contratada pelas entidades responsáveis.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 2, "code": "1.2", "text": "O acesso é realizado através do Multi Theft Auto. Ao entrar na cidade, o jogador aceita os termos e regras.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 4, "code": "2.1", "text": "É obrigatório cumprir todas as regras gerais e específicas de Roleplay.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 5, "code": "2.2", "text": "Conhecer as regras não isenta o jogador de agir com bom senso.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 6, "code": "2.3", "text": "Cada jogador é responsável por se manter atualizado.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 7, "code": "2.4", "text": "A utilização de ferramentas de monitorização para segurança e integridade é aceite ao entrar no servidor.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 8, "code": "2.5", "text": "Em caso de dúvida, procure esclarecimento junto da Staff antes de realizar a ação.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 10, "code": "3.1", "text": "A Administração possui autonomia para aplicar as punições adequadas.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 11, "code": "3.2", "text": "As punições podem incluir advertências, sanções temporárias e banimentos.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 12, "code": "3.3", "text": "A reincidência poderá agravar a punição, podendo resultar em banimento permanente.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 14, "code": "4.1", "text": "As compras contribuem para a manutenção e melhoria do servidor.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 15, "code": "4.2", "text": "Os compradores estão sujeitos às mesmas regras que os restantes jogadores.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 17, "code": "5.1", "text": "Os itens pertencem exclusivamente ao ambiente da Lusa Roleplay.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 18, "code": "5.2", "text": "É proibida a compra ou venda de itens por dinheiro real ou plataformas externas.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 20, "code": "6.1", "text": "O wipe reinicia itens e ativos para equilibrar a economia e renovar a experiência.", "sectionTitle": "Termos e Condições"}, {"section": "termos", "idx": 21, "code": "6.2", "text": "O wipe não elimina punições nem o histórico comportamental.", "sectionTitle": "Termos e Condições"}, {"section": "rp", "idx": 5, "code": "9.1", "text": "Valorize a vida da personagem e evite perigos desnecessários.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 6, "code": "9.2", "text": "É proibido enfrentar situações perigosas de forma irrealista.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 7, "code": "9.3", "text": "Perante risco iminente, priorize a sobrevivência.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 8, "code": "9.4", "text": "Respeite ferimentos e demonstre as suas consequências.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 10, "code": "10.1", "text": "Atacar, ferir ou matar sem motivo válido de RP constitui RDM.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 11, "code": "10.2", "text": "Não inicie combates sem contexto narrativo válido.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 13, "code": "11.1", "text": "Utilizar veículos para atropelar, ferir ou matar sem justificação válida constitui VDM.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 15, "code": "12.1", "text": "É proibido desligar-se intencionalmente durante uma ação para evitar consequências.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 16, "code": "12.2", "text": "Sair do servidor após ficar incapacitado para escapar ao RP é considerado Combat Logging.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 18, "code": "13.1", "text": "É proibida a utilização irrealista das mecânicas do jogo para obter vantagens.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 20, "code": "14.1", "text": "É proibido utilizar informação obtida fora do RP para influenciar a personagem.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 22, "code": "15.1", "text": "É proibida a vingança após a morte da personagem utilizando informações que ela não poderia possuir.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 24, "code": "16.1", "text": "É proibido provocar ou enganar a polícia de forma abusiva apenas para gerar uma situação de confronto.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 26, "code": "17.1", "text": "São proibidos insultos, provocações, ameaças, discriminação e assédio.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 28, "code": "18.1", "text": "Temas extremos ou perturbadores que ultrapassem os limites aceitáveis de RP são proibidos.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 30, "code": "19.1", "text": "Os nomes devem ser realistas e adequados ao Roleplay.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 32, "code": "20.1", "text": "É proibido forçar situações sem narrativa coerente para provocar confrontos ou mortes.", "sectionTitle": "Regras de Roleplay"}, {"section": "rp", "idx": 34, "code": "21.1", "text": "Furto consiste na obtenção de bens sem abordagem direta. Roubo envolve abordagem, intimidação ou violência.", "sectionTitle": "Regras de Roleplay"}, {"section": "gerais", "idx": 0, "code": "22.1", "text": "O bom senso é primordial.", "sectionTitle": "Regras Gerais"}, {"section": "gerais", "idx": 1, "code": "22.2", "text": "É proibido utilizar “OFF RP” dentro da cidade.", "sectionTitle": "Regras Gerais"}, {"section": "gerais", "idx": 2, "code": "22.5", "text": "Em caso de crash durante uma ação, o jogador fica automaticamente fora da ação até ao seu término.", "sectionTitle": "Regras Gerais"}, {"section": "gerais", "idx": 3, "code": "22.7", "text": "É proibido furtar ou roubar veículos de serviços legais.", "sectionTitle": "Regras Gerais"}, {"section": "gerais", "idx": 4, "code": "22.12", "text": "A utilização de /cam para criação de conteúdo, benefício próprio ou ações indevidas é proibida.", "sectionTitle": "Regras Gerais"}, {"section": "gerais", "idx": 5, "code": "22.18", "text": "É proibido utilizar garagens para escapar a abordagens, perseguições ou ações policiais.", "sectionTitle": "Regras Gerais"}, {"section": "gerais", "idx": 6, "code": "22.19", "text": "Após entrar no servidor, respeite os 5 minutos de GOD MOD.", "sectionTitle": "Regras Gerais"}, {"section": "gerais", "idx": 7, "code": "22.22", "text": "É proibida a exploração de bugs para obter vantagens.", "sectionTitle": "Regras Gerais"}, {"section": "gerais", "idx": 8, "code": "22.23", "text": "O servidor é restrito a maiores de 18 anos.", "sectionTitle": "Regras Gerais"}, {"section": "punicoes", "idx": 0, "code": "Combat Log", "text": "3h + 10% do dinheiro + remoção do inventário + restantes medidas aplicáveis.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 1, "code": "Metagaming", "text": "2h + 10% do dinheiro.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 2, "code": "Flaming", "text": "2h + 10% do dinheiro.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 3, "code": "Anti Amor à Vida", "text": "3h + 10%, podendo existir PD.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 4, "code": "RDM", "text": "3h + 10% do saldo total + medidas adicionais aplicáveis.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 5, "code": "VDM", "text": "2h30 + 10% + medidas adicionais aplicáveis.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 6, "code": "Quebra de Regras", "text": "1h30 + 10%.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 7, "code": "Car Jack", "text": "1h + 10%.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 8, "code": "Forçar RP", "text": "1h30 + 10%.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 9, "code": "Revenge Kill", "text": "2h + 10%.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 10, "code": "Abuso de Bug", "text": "3h + 10%, podendo existir PD ou medidas adicionais.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 11, "code": "Anti-Roleplay", "text": "2h30 + 10%.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 12, "code": "PowerGaming", "text": "3h + 10%, podendo existir PD.", "sectionTitle": "Regras de Punições"}, {"section": "punicoes", "idx": 13, "code": "Dark RP", "text": "3h + PD, conforme avaliação administrativa.", "sectionTitle": "Regras de Punições"}, {"section": "policia", "idx": 0, "code": "23.1", "text": "Não é permitido representar simultaneamente uma personagem policial e uma personagem ilegal, salvo o corpo policial de investigação.", "sectionTitle": "Regras Policiais"}, {"section": "policia", "idx": 1, "code": "23.4", "text": "A polícia não pode parar ou revistar sem motivo válido.", "sectionTitle": "Regras Policiais"}, {"section": "policia", "idx": 2, "code": "23.8", "text": "Entradas em favelas dependem dos requisitos de contingente, autorização e provas definidos pela regra.", "sectionTitle": "Regras Policiais"}, {"section": "policia", "idx": 3, "code": "24.1", "text": "Caixa 2 policial é proibido sem autorização da Staff.", "sectionTitle": "Regras Policiais"}, {"section": "policia", "idx": 4, "code": "25.1", "text": "Nas perseguições com fuga limpa, devem ser respeitados os 5 minutos previstos nas regras 43–45 antes de serem efetuados disparos contra os pneus, salvo se os fugitivos iniciarem confronto armado antes desse período.", "sectionTitle": "Regras Policiais"}, {"section": "safe", "idx": 1, "code": "28.1", "text": "Não espere que alguém abandone uma Safezone para iniciar uma abordagem, roubo ou ação.", "sectionTitle": "Safezones"}, {"section": "safe", "idx": 2, "code": "28.4", "text": "Não são permitidos sons ambiente em Safezones.", "sectionTitle": "Safezones"}, {"section": "denuncias", "idx": 0, "code": "29.1", "text": "A denúncia deve explicar claramente o ocorrido, envolvidos, infração, data, hora e local.", "sectionTitle": "Regras de Denúncias"}, {"section": "denuncias", "idx": 1, "code": "29.2", "text": "O vídeo deve ter, preferencialmente, pelo menos 1 minuto e incluir áudio e comunicação relevante do jogo.", "sectionTitle": "Regras de Denúncias"}, {"section": "denuncias", "idx": 2, "code": "29.7", "text": "O prazo para apresentar uma denúncia é de 48 horas.", "sectionTitle": "Regras de Denúncias"}, {"section": "denuncias", "idx": 3, "code": "29.8", "text": "Os vídeos devem ser enviados através de plataformas externas de streaming; não são aceites links de armazenamento em nuvem.", "sectionTitle": "Regras de Denúncias"}, {"section": "denuncias", "idx": 4, "code": "29.10", "text": "Guarde o clip durante pelo menos 7 dias após a ação.", "sectionTitle": "Regras de Denúncias"}, {"section": "denuncias", "idx": 5, "code": "29.12", "text": "É proibido gravar, divulgar ou partilhar chamadas de alinhamento da Staff.", "sectionTitle": "Regras de Denúncias"}, {"section": "acoes", "idx": 0, "code": "30.1", "text": "Não utilize comandos antes, durante ou depois de ações para obter vantagens indevidas.", "sectionTitle": "Regras de Ações"}, {"section": "acoes", "idx": 1, "code": "30.3", "text": "O porta-bagagens não pode ser utilizado para iniciar ou realizar drops em ações de rua/marcadas, salvo as exceções previstas.", "sectionTitle": "Regras de Ações"}, {"section": "acoes", "idx": 2, "code": "30.5", "text": "Durante uma fuga limpa não são permitidos tiroteios ou utilização de armas para iniciar confronto.", "sectionTitle": "Regras de Ações"}, {"section": "acoes", "idx": 3, "code": "30.8", "text": "Não é permitido matar sem dar voz.", "sectionTitle": "Regras de Ações"}, {"section": "acoes", "idx": 4, "code": "30.10", "text": "O resgate máximo normal é de 50 000 € por refém e até 4 reféns por ação, salvo as exceções previstas para ações não marcadas.", "sectionTitle": "Regras de Ações"}, {"section": "acoes", "idx": 5, "code": "30.12", "text": "As guerras devem respeitar os limites mínimos e máximos de participantes definidos.", "sectionTitle": "Regras de Ações"}, {"section": "acoes", "idx": 7, "code": "31.1", "text": "Cobranças devem possuir contexto e respeitar os prazos definidos.", "sectionTitle": "Regras de Ações"}, {"section": "acoes", "idx": 9, "code": "32.1", "text": "Invasões de favelas e casas de crime exigem RP, história e contexto prévios.", "sectionTitle": "Regras de Ações"}, {"section": "ilegal", "idx": 1, "code": "34.01", "text": "As decisões da Cúpula das facções devem ser respeitadas por todos os membros.", "sectionTitle": "Ilegal"}, {"section": "ilegal", "idx": 2, "code": "34.02", "text": "Após a marcação de uma guerra ou invasão, a facção atingida é obrigada a participar, podendo existir sanções ou multa em caso de incumprimento.", "sectionTitle": "Ilegal"}, {"section": "ilegal", "idx": 4, "code": "35.01", "text": "As guerras devem ter motivo grave, narrativa sólida, comunicação à Cúpula e antecedência mínima de 48 horas.", "sectionTitle": "Ilegal"}, {"section": "ilegal", "idx": 5, "code": "35.02", "text": "Nenhuma guerra pode começar sem autorização da Cúpula. A duração máxima é de 5 dias, com intervalo mínimo de 12 horas entre grandes confrontos.", "sectionTitle": "Ilegal"}, {"section": "ilegal", "idx": 6, "code": "35.03", "text": "Cada facção pode mobilizar até 20 membros por confronto. Aliados precisam de autorização prévia.", "sectionTitle": "Ilegal"}, {"section": "ilegal", "idx": 8, "code": "36.01", "text": "A vida de cada membro deve ser devidamente valorizada. A falta de valorização poderá resultar em PD.", "sectionTitle": "Ilegal"}, {"section": "assaltos", "idx": 0, "code": "37.01", "text": "O assalto deve possuir motivo coerente e fazer sentido dentro do Roleplay.", "sectionTitle": "37–41 — Assaltos de Rua e Sequestro"}, {"section": "assaltos", "idx": 1, "code": "37.03", "text": "O saqueamento de uma pessoa desmaiada só pode ser realizado por jogadores diretamente envolvidos na ação.", "sectionTitle": "37–41 — Assaltos de Rua e Sequestro"}, {"section": "assaltos", "idx": 2, "code": "37.04", "text": "É proibido realizar assaltos sozinho; são necessários pelo menos 2 jogadores.", "sectionTitle": "37–41 — Assaltos de Rua e Sequestro"}, {"section": "assaltos", "idx": 3, "code": "38.01", "text": "É proibido assaltar em Safezones ou em locais de grande movimentação policial.", "sectionTitle": "37–41 — Assaltos de Rua e Sequestro"}, {"section": "assaltos", "idx": 4, "code": "39.01", "text": "Utilize uma abordagem coerente, sem termos OOC.", "sectionTitle": "37–41 — Assaltos de Rua e Sequestro"}, {"section": "assaltos", "idx": 5, "code": "39.06", "text": "Um refém pode ser mantido durante, no máximo, 1 hora.", "sectionTitle": "37–41 — Assaltos de Rua e Sequestro"}, {"section": "assaltos", "idx": 6, "code": "40.01", "text": "O uso de armas deve ser proporcional à situação.", "sectionTitle": "37–41 — Assaltos de Rua e Sequestro"}, {"section": "assaltos", "idx": 7, "code": "41.03", "text": "Trate a vítima dentro do RP e evite humilhação excessiva ou tortura sem contexto.", "sectionTitle": "37–41 — Assaltos de Rua e Sequestro"}, {"section": "fuga", "idx": 0, "code": "43.01", "text": "A fuga limpa terá duração de 5 minutos, contados a partir do início efetivo da perseguição. Durante este período, nenhuma das partes poderá realizar disparos contra o veículo ou iniciar confronto armado.", "sectionTitle": "43–45 — Fuga da Polícia"}, {"section": "fuga", "idx": 1, "code": "43.02", "text": "Após os 5 minutos de fuga limpa, a polícia poderá efetuar disparos exclusivamente contra os pneus do veículo em fuga, com o objetivo de o imobilizar.", "sectionTitle": "43–45 — Fuga da Polícia"}, {"section": "fuga", "idx": 2, "code": "43.03", "text": "É proibida a realização de manobras PIT por ambas as partes durante toda a perseguição. Também são proibidas colisões intencionais utilizadas para rodar, empurrar ou retirar o veículo adversário da via.", "sectionTitle": "43–45 — Fuga da Polícia"}, {"section": "fuga", "idx": 3, "code": "44.01", "text": "Caso o veículo em fuga capote, não poderá retomar a fuga com o mesmo veículo. Os ocupantes deverão abandoná-lo e optar por rendição, fuga a pé ou confronto armado, assumindo as consequências da escolha.", "sectionTitle": "43–45 — Fuga da Polícia"}, {"section": "fuga", "idx": 4, "code": "44.02", "text": "Caso o veículo fique com os quatro pneus furados, é obrigatório abandonar o veículo. Os ocupantes poderão render-se, fugir a pé ou iniciar confronto armado.", "sectionTitle": "43–45 — Fuga da Polícia"}, {"section": "fuga", "idx": 5, "code": "44.03", "text": "Durante os 5 minutos de fuga limpa, é proibido dropar ou iniciar disparos contra a polícia. O incumprimento desta regra poderá resultar em prisão administrativa, conforme avaliação da Staff.", "sectionTitle": "43–45 — Fuga da Polícia"}, {"section": "fuga", "idx": 6, "code": "45.01", "text": "Durante corridas ilegais não é permitido apoio de terceiros durante a perseguição.", "sectionTitle": "43–45 — Fuga da Polícia"}, {"section": "pacificacao", "idx": 0, "code": "46.01", "text": "Após uma invasão policial, o território fica em pacificação durante 1 dia e a facção não pode utilizá-lo.", "sectionTitle": "46 — Pacificação / Incursão"}, {"section": "pacificacao", "idx": 1, "code": "46.02", "text": "No final da pacificação, a Administração avaliará o regresso da facção ao território.", "sectionTitle": "46 — Pacificação / Incursão"}, {"section": "pacificacao", "idx": 2, "code": "46.03", "text": "Caso a polícia conquiste o território, os itens ilegais armazenados no baú são confiscados e perdidos permanentemente.", "sectionTitle": "46 — Pacificação / Incursão"}, {"section": "pacificacao", "idx": 3, "code": "46.04", "text": "A autorização de uma pacificação exige provas e anexos que justifiquem a operação.", "sectionTitle": "46 — Pacificação / Incursão"}, {"section": "drogas", "idx": 0, "code": "", "text": "A venda pode ocorrer com NPCs na rua, em locais específicos e com outras pessoas, não sendo exclusiva de qualquer grupo.", "sectionTitle": "Compra e Venda de Drogas"}, {"section": "drogas", "idx": 1, "code": "", "text": "Não existe limite mínimo ou máximo de participantes.", "sectionTitle": "Compra e Venda de Drogas"}, {"section": "drogas", "idx": 2, "code": "", "text": "É extremamente proibida a utilização de armas de fogo por bandidos e polícias durante a venda.", "sectionTitle": "Compra e Venda de Drogas"}, {"section": "drogas", "idx": 3, "code": "", "text": "A polícia pode utilizar Taser conforme a situação, respeitando a quantidade equivalente de bandidos presentes ou em caso de fuga.", "sectionTitle": "Compra e Venda de Drogas"}, {"section": "drogas", "idx": 4, "code": "", "text": "É extremamente proibida a utilização de helicópteros durante a venda de drogas.", "sectionTitle": "Compra e Venda de Drogas"}, {"section": "emboscada", "idx": 0, "code": "47.01", "text": "O QRR de ambos os lados só é permitido se os reforços chegarem durante a perseguição, antes do início dos disparos. Os criminosos podem posicionar o QRR no local escolhido para a troca de tiros.", "sectionTitle": "47 — Emboscada"}, {"section": "emboscada", "idx": 1, "code": "47.02", "text": "É obrigatório aguardar que os oponentes saiam do veículo antes de iniciar os disparos. Após o início, todos devem permanecer fora dos veículos.", "sectionTitle": "47 — Emboscada"}, {"section": "emboscada", "idx": 2, "code": "47.03", "text": "A ação inicia quando o veículo perseguidor realiza o drop ou, numa emboscada, quando entra no local onde os membros estão posicionados.", "sectionTitle": "47 — Emboscada"}, {"section": "emboscada", "idx": 3, "code": "47.04", "text": "Não é permitido Taser nesta finalidade; apenas armas de fogo.", "sectionTitle": "47 — Emboscada"}, {"section": "sequestro", "idx": 1, "code": "", "text": "Não são válidos motivos como antipatia, discussões no Discord, denúncias ou outras ações fora do RP.", "sectionTitle": "49 — Sequestro"}, {"section": "sequestro", "idx": 2, "code": "", "text": "Sequestros previamente combinados entre as partes são estritamente proibidos.", "sectionTitle": "49 — Sequestro"}, {"section": "sequestro", "idx": 4, "code": "", "text": "É proibido sequestrar jogadores em Safezones.", "sectionTitle": "49 — Sequestro"}, {"section": "sequestro", "idx": 5, "code": "", "text": "São proibidas humilhações, nudez forçada, atos ou insinuações sexuais e tortura excessiva sem desenvolvimento narrativo.", "sectionTitle": "49 — Sequestro"}, {"section": "sequestro", "idx": 7, "code": "", "text": "O sequestro deve possuir um objetivo claro e não pode ser prolongado apenas para prejudicar outro jogador.", "sectionTitle": "49 — Sequestro"}, {"section": "sequestro", "idx": 9, "code": "", "text": "O grupo que inicia o sequestro deve possuir superioridade numérica e todos os envolvidos devem estar devidamente armados.", "sectionTitle": "49 — Sequestro"}, {"section": "sequestro", "idx": 11, "code": "", "text": "Não é permitido sequestrar médicos ou mecânicos fardados. Policiais fardados só podem ser sequestrados quando existir estrutura e contexto adequado de RP.", "sectionTitle": "49 — Sequestro"}, {"section": "caixa2", "idx": 0, "code": "", "text": "Desvios de itens, valores ou recursos por membros abaixo do cargo de Gerente são considerados Caixa 2.", "sectionTitle": "50 — Caixa 2"}, {"section": "caixa2", "idx": 1, "code": "", "text": "Membros com cargo de Gerente ou superior não se enquadram nesta regra; conflitos deste tipo devem ser resolvidos internamente através de RP e cobranças.", "sectionTitle": "50 — Caixa 2"}, {"section": "caixa2", "idx": 2, "code": "", "text": "Não é permitida corrupção policial, incluindo utilização indevida de dinheiro ou itens apreendidos. Infrações comprovadas poderão resultar em banimento permanente.", "sectionTitle": "50 — Caixa 2"}, {"section": "software", "idx": 0, "code": "51.01", "text": "Em caso de suspeita de cheats, o jogador poderá ser monitorizado pela Staff.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 1, "code": "51.02", "text": "Após ser informado de que será monitorizado, deverá comparecer ao suporte no prazo máximo de 60 segundos.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 2, "code": "52.03", "text": "É proibido fechar o jogo quando um membro da Staff solicitar entrada numa chamada de suporte.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 3, "code": "52.04", "text": "É proibido desligar o computador durante a verificação.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 4, "code": "52.05", "text": "Vestígios de cheats/bypass ou conversas com vendedores de hacks podem resultar em banimento permanente.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 5, "code": "52.06", "text": "A utilização de bypass para ocultar ou apagar provas, desativar configurações ou interromper processos/registos também poderá resultar em banimento permanente.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 6, "code": "52.07", "text": "É proibida qualquer apologia a hacks, bypass ou trapaças.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 7, "code": "52.08", "text": "Após abordagem ou banimento, é proibida qualquer manipulação dos ficheiros, aplicações, processos ou registos do computador relacionados com a verificação.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 8, "code": "52.09", "text": "É proibido remover dispositivos USB, formatar o computador, criar pontos de restauro, trocar o utilizador do Windows ou iniciar aplicações de limpeza/desinstalação durante a verificação.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 9, "code": "52.10", "text": "Três ou mais denúncias com vídeos que apresentem suspeitas de aimbot, wallhack ou semelhantes poderão ser analisadas por especialistas.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 10, "code": "52.11", "text": "Ficheiros identificados como bypass ou com remoções/alterações de datas poderão ser considerados cheat.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 11, "code": "52.12", "text": "A recusa em realizar a verificação poderá resultar em banimento.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 12, "code": "52.13", "text": "É proibida a permanência em Discords dedicados a cheats/bypass.", "sectionTitle": "51–52 — Software"}, {"section": "software", "idx": 13, "code": "52.14", "text": "É proibido compactuar com cheaters/bypass.", "sectionTitle": "51–52 — Software"}, {"section": "acoes-especificas", "idx": 1, "code": "", "text": "Bandidos: mínimo 2, máximo 4. Polícia: mínimo 2, máximo 4.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 2, "code": "", "text": "Não é permitido armamento; a ação é realizada exclusivamente com combate corpo a corpo.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 3, "code": "", "text": "Negociação obrigatória. Permanência de 15 minutos após a conclusão. Não é permitida fuga.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 4, "code": "", "text": "Permitidos utilitários: energético, kit médico e colete.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 5, "code": "", "text": "Perímetro: apenas o interior da barbearia.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 7, "code": "", "text": "Bandidos: 2–4. Polícia: 3–5. Apenas pistolas. Máximo de 1 refém.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 8, "code": "", "text": "Negociação obrigatória. Pode ser negociada fuga com apenas 1 carro dos bandidos.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 9, "code": "", "text": "Após 8 minutos de FF, é permitido rush para o perímetro frontal e lateral da loja.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 11, "code": "", "text": "Bandidos: mínimo 1. Polícia: 1–3 unidades.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 12, "code": "", "text": "Fuga limpa durante os primeiros 5 minutos. Após esse período, aplicam-se integralmente as regras 43–45 de Fuga da Polícia.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 13, "code": "", "text": "BAIT apenas em áreas definidas como emboscada. Todas as armas são permitidas durante a emboscada.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 15, "code": "", "text": "Bandidos: 6–8. Polícia: 8–10. Permitido apenas Sub. Máximo de 4 reféns.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 16, "code": "", "text": "Tempo de espera: 35 minutos. Fuga negociável. Máximo de 3 carros por lado dos bandidos.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 18, "code": "", "text": "Bandidos: 5–7. Polícia: 7–9. Permitido apenas Sub. Máximo de 4 reféns.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 19, "code": "", "text": "Tempo de espera: 35 minutos. Fuga proibida. Perímetro conforme imagem oficial da ação.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 21, "code": "", "text": "Bandidos: 8–12. Polícia: 11–15. Permitido apenas fuzil. Máximo de 4 reféns.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 22, "code": "", "text": "Tempo de espera: 50 minutos. Só é permitido sair do banco após 10 minutos de FF. Até 2 elementos podem ficar fora durante a negociação, respeitando o perímetro.", "sectionTitle": "Ações — Regras específicas"}, {"section": "acoes-especificas", "idx": 23, "code": "", "text": "É proibido utilizar bugs visuais ou permanecer avançado na zona do caixa à espera da entrada da polícia.", "sectionTitle": "Ações — Regras específicas"}];
const navOrder=[["geral", "Livro de Regras"], ["termos", "Termos e Condições"], ["rp", "Regras de Roleplay"], ["gerais", "Regras Gerais"], ["punicoes", "Regras de Punições"], ["policia", "Regras Policiais"], ["safe", "Safezones"], ["denuncias", "Denúncias"], ["acoes", "Ações"], ["ilegal", "Ilegal"], ["assaltos", "Assaltos e Sequestro"], ["fuga", "Fuga da Polícia"], ["pacificacao", "Pacificação / Incursão"], ["drogas", "Compra e Venda de Drogas"], ["emboscada", "Emboscada"], ["sequestro", "Sequestro"], ["caixa2", "Caixa 2"], ["software", "Software"], ["acoes-especificas", "Ações — Regras específicas"]];
const iconPaths={"geral": "<path d=\"M3 11.5 12 4l9 7.5\"/><path d=\"M5 10.5V20h14v-9.5\"/><path d=\"M9 20v-6h6v6\"/>", "termos": "<path d=\"M6 2h9l5 5v15H6z\"/><path d=\"M14 2v6h6\"/><path d=\"M9 13h6M9 17h6\"/>", "rp": "<circle cx=\"9\" cy=\"8\" r=\"3\"/><circle cx=\"17\" cy=\"8\" r=\"3\"/><path d=\"M3 20c.8-4 3-6 6-6s5.2 2 6 6M13 20c.5-3 2-5 4-5 2.5 0 4 2 4.5 5\"/>", "gerais": "<path d=\"M12 2 20 6v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z\"/><path d=\"m9 12 2 2 4-4\"/>", "punicoes": "<path d=\"M8 3h8v4H8z\"/><path d=\"M6 7h12v14H6z\"/><path d=\"M9 11h6M9 15h6\"/>", "policia": "<path d=\"M12 2 15 7l5 .8-3.6 3.7.9 5.2L12 14.2 6.7 16.7l.9-5.2L4 7.8 9 7z\"/>", "safe": "<path d=\"M12 2 20 6v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z\"/><path d=\"M8.5 12.5 11 15l4.5-5\"/>", "denuncias": "<path d=\"M4 4h16v13H7l-3 3z\"/><path d=\"M8 8h8M8 12h5\"/>", "acoes": "<path d=\"M4 12h16M12 4v16\"/><circle cx=\"12\" cy=\"12\" r=\"8\"/>", "ilegal": "<path d=\"M4 20 20 4M7 4h4l2 2v4M13 14l2 2h5\"/>", "assaltos": "<path d=\"M4 10h16v10H4z\"/><path d=\"M7 10V7a5 5 0 0 1 10 0v3\"/>", "fuga": "<path d=\"M5 16h14l-1.5-6h-11z\"/><path d=\"M7 10 9 6h6l2 4\"/><circle cx=\"8\" cy=\"17.5\" r=\"1.5\"/><circle cx=\"16\" cy=\"17.5\" r=\"1.5\"/>", "pacificacao": "<path d=\"M12 3v18M5 8h14M7 8l-2 8h4zM17 8l-2 8h4z\"/>", "drogas": "<path d=\"M8 3h8v4l3 4v8H5v-8l3-4z\"/><path d=\"M9 13h6\"/>", "emboscada": "<circle cx=\"12\" cy=\"12\" r=\"8\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3\"/>", "sequestro": "<path d=\"M7 7a5 5 0 1 1 10 0c0 3-2 4-5 4s-5-1-5-4Z\"/><path d=\"M5 22c1-5 3-8 7-8s6 3 7 8\"/>", "caixa2": "<rect x=\"3\" y=\"6\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M7 6V4h10v2M8 13h8\"/>", "software": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M8 22h8M12 18v4\"/>", "acoes-especificas": "<path d=\"M4 6h16M4 12h16M4 18h16\"/>"};
const navButtons=[...document.querySelectorAll('.nav-item')];
const ruleList=document.getElementById('ruleList');
const sectionTitle=document.getElementById('sectionTitle');
const sectionDesc=document.getElementById('sectionDesc');
const sectionIcon=document.getElementById('sectionIcon');
const ghostNum=document.getElementById('ghostNum');
const crumbTitle=document.getElementById('crumbTitle');
const search=document.getElementById('search');
const results=document.getElementById('searchResults');
const sidebar=document.getElementById('sidebar');
const contentShell=document.getElementById('contentShell');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function svgFor(id,cls=''){return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconPaths[id]||iconPaths.geral}</svg>`}
function deriveGhost(title){const m=title.match(/\d+[–-]\d+|\d+(?:\.\d+)?/);return m?m[0]:''}
function renderSection(id,focusRule=-1){
  const sec=sections[id]||sections.geral; currentSection=id;
  sectionTitle.textContent=sec.title; sectionDesc.textContent=sec.desc; crumbTitle.textContent=sec.title;
  sectionIcon.innerHTML=svgFor(id); ghostNum.textContent=deriveGhost(sec.title);
  navButtons.forEach(b=>b.classList.toggle('active',b.dataset.section===id));
  ruleList.innerHTML='';
  sec.items.forEach((it,idx)=>{
    if(it.type==='group'){const el=document.createElement('div');el.className='group-title';el.textContent=it.text;ruleList.appendChild(el);return}
    if(it.type==='text'){const el=document.createElement('div');el.className='text-card';el.textContent=it.text;ruleList.appendChild(el);return}
    if(it.type==='note'){const el=document.createElement('div');el.className='note-card';el.textContent=it.text;ruleList.appendChild(el);return}
    if(it.type==='list'){const el=document.createElement('div');el.className='list-card';el.innerHTML='<ul>'+it.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';ruleList.appendChild(el);return}
    if(it.type==='rule'){
      const card=document.createElement('div');card.className='rule-card';card.dataset.idx=idx;
      const code=it.code||'Regra';
      card.innerHTML=`<div class="rule-row"><div class="rule-code ${it.code?'':'generic'}">${esc(code)}</div><div class="rule-summary">${esc(it.text)}</div><div class="rule-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg></div></div><div class="rule-detail">${esc(it.text)}</div>`;
      card.querySelector('.rule-row').addEventListener('click',()=>card.classList.toggle('open'));
      ruleList.appendChild(card);
      if(idx===focusRule){card.classList.add('open');setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),80)}
    }
  });
  history.replaceState(null,'','#'+id);
  if(window.innerWidth<760) sidebar.classList.remove('show');
}
let currentSection='fuga';
navButtons.forEach(b=>b.addEventListener('click',()=>renderSection(b.dataset.section)));
function norm(t){return (t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function doSearch(){
  const q=norm(search.value.trim());
  if(!q){results.classList.remove('show');results.innerHTML='';return}
  const hits=searchIndex.filter(r=>norm(`${r.code} ${r.text} ${r.sectionTitle}`).includes(q)).slice(0,12);
  results.innerHTML=hits.length?hits.map(h=>`<div class="result" data-section="${h.section}" data-idx="${h.idx}"><div class="result-top"><span class="result-code">${esc(h.code||'Regra')}</span><span>${esc(h.text.length>84?h.text.slice(0,84)+'…':h.text)}</span></div><div class="result-sec">${esc(h.sectionTitle)}</div></div>`).join(''):'<div class="no-result">Nenhuma regra encontrada.</div>';
  results.classList.add('show');
  results.querySelectorAll('.result').forEach(el=>el.addEventListener('click',()=>{renderSection(el.dataset.section,Number(el.dataset.idx));search.value='';results.classList.remove('show')}));
}
search.addEventListener('input',doSearch);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}if(e.key==='Escape')results.classList.remove('show')});
document.addEventListener('click',e=>{if(!e.target.closest('.search-box'))results.classList.remove('show')});
document.getElementById('mobileMenu').addEventListener('click',()=>sidebar.classList.toggle('show'));
let initial=location.hash.slice(1);if(!sections[initial])initial='fuga';renderSection(initial);
</script>
